<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>فارماكير بلس - نظام إدارة ونقاط بيع الصيدليات</title>
    <meta name="description" content="نظام محاسبة ونقاط بيع (POS) وإدارة صيدلية متكامل، يعمل بدون إنترنت (Offline-First) مع ماسح باركود ذكي وإدارة أدوية وبدائل وطباعة إيصالات حرارية." />
    <meta property="og:title" content="فارماكير بلس - نظام إدارة ونقاط بيع الصيدليات" />
    <meta property="og:description" content="نظام محاسبة ونقاط بيع (POS) وإدارة صيدلية متكامل، يعمل بدون إنترنت (Offline-First) مع ماسح باركود ذكي وإدارة أدوية وبدائل وطباعة إيصالات حرارية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="فارماكير" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="alternate icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-receipt, #printable-receipt * {
          visibility: visible;
        }
        #printable-receipt {
          position: absolute;
          left: 0;
          top: 0;
          width: 58mm;
          margin: 0;
          padding: 6px;
          background: white;
          color: black;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased select-none selection:bg-sky-100 selection:text-sky-900">
    <div id="root"></div>
    <div id="sw-update-toast" style="display: none; position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 400px; margin: 0 auto; z-index: 99999; background: #0284c7; color: white; padding: 14px 18px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); font-family: 'Tajawal', sans-serif; direction: rtl; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="font-size: 13px; font-weight: bold;">🎉 يوجد تحديث جديد لفارماكير بلس!</div>
      <button id="sw-update-btn" style="background: white; color: #0284c7; border: none; padding: 6px 14px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; white-space: nowrap;">تحديث الآن 🚀</button>
    </div>
    <!-- Google Identity Services for reliable client-side OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(function(reg) {
              console.log('PharmaCare Service Worker Active:', reg.scope);
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      var toast = document.getElementById('sw-update-toast');
                      var btn = document.getElementById('sw-update-btn');
                      if (toast && btn) {
                        toast.style.display = 'flex';
                        btn.onclick = function() {
                          newWorker.postMessage({ type: 'SKIP_WAITING' });
                          window.location.reload();
                        };
                      }
                    }
                  });
                }
              });
            })
            .catch(function(err) {
              console.warn('Service Worker registration skipped:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
