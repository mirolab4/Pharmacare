<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Inner circular glow -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.08" />
  <!-- Medical Plus / Cross -->
  <g filter="url(#shadow)">
    <rect x="216" y="126" width="80" height="260" rx="20" fill="url(#crossGrad)" />
    <rect x="126" y="216" width="260" height="80" rx="20" fill="url(#crossGrad)" />
    <!-- Center pulse / heart / capsule touch -->
    <circle cx="256" cy="256" r="32" fill="#0284c7" />
    <path d="M256 244 L256 268 M244 256 L268 256" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
